<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溫暖手記 | Card Wall</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter & Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        },
                        cream: {
                            50: '#fffdfa',
                            100: '#fdfbf7',
                            200: '#f7f3eb',
                            300: '#efe8da',
                            400: '#e2d5c1',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f7f3eb;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2d5c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-warm-200">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-30 bg-cream-100/90 backdrop-blur-md border-b border-warm-200/60 shadow-sm transition-all duration-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-warm-500 to-warm-300 flex items-center justify-center text-white shadow-md shadow-warm-500/20">
                    <i class="fa-solid fa-note-sticky text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide text-warm-900">暖心日誌 <span class="text-xs font-normal text-warm-600 bg-warm-100 px-2 py-0.5 rounded-full border border-warm-200">Warm Card</span></h1>
            </div>

            <button id="openModalBtn" class="bg-warm-600 hover:bg-warm-700 active:scale-95 text-white font-medium px-4 py-2 rounded-xl shadow-md shadow-warm-600/20 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-plus text-sm"></i>
                <span class="hidden sm:inline">新增卡片</span>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- 控制與篩選面板 -->
        <section class="bg-white/80 backdrop-blur border border-warm-200/80 rounded-2xl p-4 sm:p-6 mb-8 shadow-sm">
            <div class="flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
                <!-- 日期選擇與篩選 -->
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-2 bg-cream-200/60 border border-warm-200 px-3 py-2 rounded-xl text-warm-800 text-sm">
                        <i class="fa-regular fa-calendar-days text-warm-600"></i>
                        <span class="font-medium">篩選日期:</span>
                        <input type="date" id="filterDate" class="bg-transparent focus:outline-none text-warm-900 font-medium cursor-pointer">
                    </div>
                    <button id="clearDateBtn" class="text-xs text-warm-700 hover:text-warm-900 underline underline-offset-4 hidden">
                        清除日期篩選
                    </button>
                </div>

                <!-- 分類標籤篩選 -->
                <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0 scrollbar-none" id="topicFilterContainer">
                    <button class="topic-filter-btn active-filter bg-warm-600 text-white px-3.5 py-1.5 rounded-xl text-sm font-medium transition-all" data-topic="ALL">
                        全部主題
                    </button>
                    <!-- 動態載入主題標籤 -->
                </div>
            </div>
        </section>

        <!-- 卡片網格區 -->
        <section id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 卡片會由 JavaScript 動態生成 -->
        </section>

        <!-- 無資料顯示狀態 -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-20 h-20 bg-warm-100 rounded-full flex items-center justify-center mb-4 text-warm-400">
                <i class="fa-regular fa-folder-open text-3xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-warm-900 mb-1">找不到相關卡片</h3>
            <p class="text-sm text-warm-600 mb-4">嘗試調整日期或選擇其他主題標籤</p>
            <button id="resetFiltersBtn" class="text-xs bg-warm-200 hover:bg-warm-300 text-warm-800 px-4 py-2 rounded-xl transition-all">
                重置所有篩選
            </button>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer class="bg-cream-200/50 border-t border-warm-200/60 py-6 text-center text-sm text-warm-600 mt-12">
        <p>© 2026 溫暖手記 Warm Cards Wall. All rights reserved.</p>
    </footer>

    <!-- 新增卡片 Modal 彈窗 -->
    <div id="cardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-warm-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-warm-100 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6 border-b border-warm-100 pb-4">
                <h2 class="text-xl font-bold text-warm-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-warm-500"></i>
                    寫下新卡片
                </h2>
                <button id="closeModalBtn" class="text-warm-400 hover:text-warm-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-cream-200 transition-all">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="cardForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-warm-800 mb-1">標題</label>
                    <input type="text" id="cardTitle" required placeholder="給這張卡片取個名字..." class="w-full px-4 py-2.5 rounded-xl border border-warm-200 focus:outline-none focus:ring-2 focus:ring-warm-500/50 focus:border-warm-500 text-warm-900 placeholder-warm-300 bg-cream-50">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-warm-800 mb-1">主題類別</label>
                        <select id="cardTopic" class="w-full px-3 py-2.5 rounded-xl border border-warm-200 focus:outline-none focus:ring-2 focus:ring-warm-500/50 focus:border-warm-500 text-warm-900 bg-cream-50">
                            <option value="日常">日常</option>
                            <option value="工作">工作</option>
                            <option value="靈感">靈感</option>
                            <option value="美食">美食</option>
                            <option value="旅行">旅行</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-warm-800 mb-1">選擇日期</label>
                        <input type="date" id="cardDate" required class="w-full px-3 py-2.5 rounded-xl border border-warm-200 focus:outline-none focus:ring-2 focus:ring-warm-500/50 focus:border-warm-500 text-warm-900 bg-cream-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-warm-800 mb-1">卡片內容</label>
                    <textarea id="cardContent" rows="4" required placeholder="寫下值得紀錄的精彩內容..." class="w-full px-4 py-2.5 rounded-xl border border-warm-200 focus:outline-none focus:ring-2 focus:ring-warm-500/50 focus:border-warm-500 text-warm-900 placeholder-warm-300 bg-cream-50 resize-none"></textarea>
                </div>

                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn" class="px-5 py-2.5 rounded-xl text-warm-700 bg-cream-200 hover:bg-cream-300 font-medium transition-all">
                        取消
                    </button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-white bg-warm-600 hover:bg-warm-700 font-medium shadow-md shadow-warm-600/20 transition-all">
                        發布卡片
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 預設示範資料
        const defaultCards = [
            {
                id: '1',
                title: '陽光燦爛的下午茶時間',
                topic: '美食',
                date: '2026-09-20',
                content: '今天造訪了一家充滿木質調與肉桂香氣的古董咖啡廳，手沖咖啡的香氣搭配現烘鬆餅，讓人忘卻一整週的忙碌。特別喜歡窗邊位置灑進來的金黃色陽光。',
                comments: [
                    { id: 'c1', author: '小明', text: '這家在哪裡！求推薦～', date: '2026-09-20 15:30' },
                    { id: 'c2', author: 'Author', text: '在市區巷弄裡，叫做「暖時咖啡館」！', date: '2026-09-20 16:05' }
                ]
            },
            {
                id: '2',
                title: '閱讀《晨間習慣》的感悟',
                topic: '靈感',
                date: '2026-09-22',
                content: '「早晨的頭一個小時，決定了你一整天的心境。」試著提早30分鐘起床，不碰手機，寫寫字、喝杯暖水，發現心境真的平靜很多！',
                comments: [
                    { id: 'c3', author: 'Eva', text: '真的！早起無手機時刻超棒！', date: '2026-09-22 09:12' }
                ]
            },
            {
                id: '3',
                title: '完成全新專案架構規劃',
                topic: '工作',
                date: '2026-09-24',
                content: '經過幾天的腦力激盪，終於把產品的新介面設計邏輯整理完畢。使用溫暖顏色當作基調，希望給使用者更多親切感與沉浸體驗。',
                comments: []
            }
        ];

        // 狀態管理
        let cards = JSON.parse(localStorage.getItem('warm_cards_data')) || defaultCards;
        let selectedTopic = 'ALL';
        let selectedDate = '';

        // DOM 元素引用
        const cardGrid = document.getElementById('cardGrid');
        const emptyState = document.getElementById('emptyState');
        const cardModal = document.getElementById('cardModal');
        const modalContent = document.getElementById('modalContent');
        const cardForm = document.getElementById('cardForm');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const filterDateInput = document.getElementById('filterDate');
        const clearDateBtn = document.getElementById('clearDateBtn');
        const resetFiltersBtn = document.getElementById('resetFiltersBtn');
        const topicFilterContainer = document.getElementById('topicFilterContainer');

        // 主題標籤顏色對應
        const topicBadgeStyles = {
            '日常': 'bg-amber-100 text-amber-800 border-amber-200',
            '工作': 'bg-stone-200 text-stone-800 border-stone-300',
            '靈感': 'bg-orange-100 text-orange-800 border-orange-200',
            '美食': 'bg-yellow-100 text-yellow-800 border-yellow-200',
            '旅行': 'bg-emerald-100 text-emerald-800 border-emerald-200'
        };

        // 初始化應用程式
        function initApp() {
            // 設定 Modal 預設日期為今天
            document.getElementById('cardDate').valueToDate = new Date();
            document.getElementById('cardDate').value = new Date().toISOString().split('T')[0];

            renderTopicFilters();
            renderCards();
            setupEventListeners();
        }

        // 保存資料到 LocalStorage
        function saveData() {
            localStorage.setItem('warm_cards_data', JSON.stringify(cards));
        }

        // 渲染主題篩選按鈕
        function renderTopicFilters() {
            const topics = ['ALL', '日常', '工作', '靈感', '美食', '旅行'];
            topicFilterContainer.innerHTML = topics.map(t => {
                const isActive = t === selectedTopic;
                const activeClass = isActive 
                    ? 'bg-warm-600 text-white shadow-sm' 
                    : 'bg-cream-200/80 hover:bg-cream-300 text-warm-800';
                const label = t === 'ALL' ? '全部主題' : t;
                return `<button class="topic-filter-btn whitespace-nowrap px-3.5 py-1.5 rounded-xl text-sm font-medium transition-all ${activeClass}" data-topic="${t}">${label}</button>`;
            }).join('');
        }

        // 渲染卡片清單
        function renderCards() {
            // 篩選邏輯
            const filteredCards = cards.filter(card => {
                const matchTopic = selectedTopic === 'ALL' || card.topic === selectedTopic;
                const matchDate = !selectedDate || card.date === selectedDate;
                return matchTopic && matchDate;
            });

            // 檢查是否沒有資料
            if (filteredCards.length === 0) {
                cardGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            // 生成卡片 HTML
            cardGrid.innerHTML = filteredCards.map(card => {
                const badgeStyle = topicBadgeStyles[card.topic] || 'bg-warm-100 text-warm-800 border-warm-200';
                
                // 渲染留言清單
                const commentsHtml = card.comments.length > 0
                    ? card.comments.map(c => `
                        <div class="bg-cream-100/70 p-2.5 rounded-xl text-xs space-y-1 border border-warm-100">
                            <div class="flex justify-between items-center text-warm-600 font-medium">
                                <span><i class="fa-regular fa-user mr-1 text-[10px]"></i>${escapeHtml(c.author)}</span>
                                <span class="text-[10px] text-warm-400">${c.date}</span>
                            </div>
                            <p class="text-warm-800 leading-relaxed">${escapeHtml(c.text)}</p>
                        </div>
                    `).join('')
                    : `<p class="text-xs text-warm-400 italic text-center py-2">還沒有留言，來留下第一個想法吧！</p>`;

                return `
                    <article class="bg-white rounded-2xl border border-warm-200/70 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between overflow-hidden group">
                        <!-- 卡片頭部與內文 -->
                        <div class="p-5 sm:p-6 space-y-3">
                            <div class="flex items-center justify-between gap-2">
                                <span class="px-2.5 py-0.5 text-xs font-semibold rounded-lg border ${badgeStyle}">
                                    ${card.topic}
                                </span>
                                <time class="text-xs font-medium text-warm-500 flex items-center gap-1">
                                    <i class="fa-regular fa-calendar text-warm-400"></i>
                                    ${card.date}
                                </time>
                            </div>

                            <h3 class="text-lg font-bold text-warm-900 group-hover:text-warm-600 transition-colors">
                                ${escapeHtml(card.title)}
                            </h3>

                            <p class="text-sm text-warm-700 leading-relaxed whitespace-pre-line">
                                ${escapeHtml(card.content)}
                            </p>
                        </div>

                        <!-- 留言區塊 -->
                        <div class="bg-cream-50/80 border-t border-warm-100 p-4 sm:p-5 space-y-3">
                            <div class="flex items-center justify-between text-xs font-semibold text-warm-700 mb-1">
                                <span class="flex items-center gap-1.5">
                                    <i class="fa-regular fa-comments text-warm-500"></i>
                                    留言 (${card.comments.length})
                                </span>
                            </div>

                            <!-- 留言清單容器 -->
                            <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                                ${commentsHtml}
                            </div>

                            <!-- 新增留言輸入框 -->
                            <form onsubmit="handleAddComment(event, '${card.id}')" class="mt-3 pt-2 flex flex-col gap-2">
                                <div class="flex gap-2">
                                    <input type="text" placeholder="您的暱稱" required class="comment-author-${card.id} w-1/3 text-xs px-2.5 py-1.5 rounded-lg border border-warm-200 focus:outline-none focus:ring-1 focus:ring-warm-500 bg-white">
                                    <input type="text" placeholder="寫下留言..." required class="comment-text-${card.id} w-2/3 text-xs px-2.5 py-1.5 rounded-lg border border-warm-200 focus:outline-none focus:ring-1 focus:ring-warm-500 bg-white">
                                </div>
                                <button type="submit" class="self-end text-xs bg-warm-600 hover:bg-warm-700 active:scale-95 text-white px-3 py-1 rounded-lg font-medium transition-all shadow-xs flex items-center gap-1">
                                    <i class="fa-solid fa-paper-plane text-[10px]"></i> 傳送
                                </button>
                            </form>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // 新增留言處理
        window.handleAddComment = function(event, cardId) {
            event.preventDefault();
            const authorInput = document.querySelector(`.comment-author-${cardId}`);
            const textInput = document.querySelector(`.comment-text-${cardId}`);

            const author = authorInput.value.trim();
            const text = textInput.value.trim();

            if (!author || !text) return;

            const card = cards.find(c => c.id === cardId);
            if (card) {
                const now = new Date();
                const formattedTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                card.comments.push({
                    id: 'c_' + Date.now(),
                    author: author,
                    text: text,
                    date: formattedTime
                });

                saveData();
                renderCards();
            }
        };

        // 安全轉義 HTML 字符
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 開啟 Modal
        function openModal() {
            cardModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        // 關閉 Modal
        function closeModal() {
            cardModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            cardForm.reset();
            // 重置日期為今天
            document.getElementById('cardDate').value = new Date().toISOString().split('T')[0];
        }

        // 事件監聽綁定
        function setupEventListeners() {
            // Modal 控制
            openModalBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);

            // 點擊 Modal 外圍關閉
            cardModal.addEventListener('click', (e) => {
                if (e.target === cardModal) closeModal();
            });

            // 表單提交處理
            cardForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('cardTitle').value.trim();
                const topic = document.getElementById('cardTopic').value;
                const date = document.getElementById('cardDate').value;
                const content = document.getElementById('cardContent').value.trim();

                if (!title || !content || !date) return;

                const newCard = {
                    id: Date.now().toString(),
                    title,
                    topic,
                    date,
                    content,
                    comments: []
                };

                cards.unshift(newCard); // 最新放置最前面
                saveData();
                renderCards();
                closeModal();
            });

            // 主題標籤點擊事件 delegation
            topicFilterContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.topic-filter-btn');
                if (!btn) return;
                
                selectedTopic = btn.dataset.topic;
                renderTopicFilters();
                renderCards();
            });

            // 日期篩選變更
            filterDateInput.addEventListener('change', (e) => {
                selectedDate = e.target.value;
                if (selectedDate) {
                    clearDateBtn.classList.remove('hidden');
                } else {
                    clearDateBtn.classList.add('hidden');
                }
                renderCards();
            });

            // 清除日期篩選
            clearDateBtn.addEventListener('click', () => {
                selectedDate = '';
                filterDateInput.value = '';
                clearDateBtn.classList.add('hidden');
                renderCards();
            });

            // 重置所有篩選
            resetFiltersBtn.addEventListener('click', () => {
                selectedTopic = 'ALL';
                selectedDate = '';
                filterDateInput.value = '';
                clearDateBtn.classList.add('hidden');
                renderTopicFilters();
                renderCards();
            });
        }

        // 頁面載入完成後執行 init
        window.onload = initApp;
    </script>
</body>
</html>
