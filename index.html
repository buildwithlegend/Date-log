<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖心日誌 - Warm Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        },
                        warmBg: '#fbf7f4',
                        warmCard: '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fbf7f4;
            background-image: radial-gradient(#e5d7ce 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }
        .line-clamp-custom {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fcd34d;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="font-sans text-amber-900 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-amber-50/90 backdrop-blur-md border-b border-amber-200/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid font-bold text-lg fa-book-open"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-amber-900 tracking-wide">暖心日誌</h1>
                    <p class="text-xs text-amber-600">紀錄生活中的美好片段</p>
                </div>
            </div>

            <!-- Controls: Filter & Add Button -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="relative flex-1 sm:flex-initial">
                    <input type="date" id="filter-date" class="w-full sm:w-auto bg-white border border-amber-200 rounded-xl px-3 py-2 text-sm text-amber-800 focus:outline-none focus:ring-2 focus:ring-amber-400 shadow-sm transition">
                </div>
                <button id="clear-filter" title="清除篩選" class="hidden bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-2 rounded-xl text-sm transition">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button onclick="openCreateModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-medium px-4 py-2 rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> 新建卡片
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Date Info Bar -->
        <div id="filter-info" class="hidden mb-6 bg-amber-100/70 border border-amber-200 rounded-xl p-3 text-sm text-amber-800 flex justify-between items-center">
            <span>顯示日期：<strong id="filter-date-display"></strong> 的卡片</span>
            <button onclick="resetFilter()" class="text-amber-600 hover:text-amber-900 font-medium underline text-xs">顯示全部</button>
        </div>

        <!-- Cards Container -->
        <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-20 h-20 bg-amber-100 text-amber-400 rounded-full flex items-center justify-center text-3xl mb-4">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <h3 class="text-lg font-medium text-amber-800 mb-1">尚無相關卡片</h3>
            <p class="text-sm text-amber-600 mb-4">開始記錄今天的心情或選擇其他日期吧！</p>
            <button onclick="openCreateModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm transition">新增卡片</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 py-6 text-center text-xs text-amber-600/80 border-t border-amber-200/40">
        <p>© Warm Notes 日誌卡片網頁 · 暖心紀錄每一天</p>
    </footer>

    <!-- Modal: Create New Card -->
    <div id="modal-create" class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-amber-100 overflow-hidden transform transition-all">
            <div class="bg-amber-50 px-6 py-4 border-b border-amber-100 flex justify-between items-center">
                <h3 class="font-bold text-amber-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-500"></i> 新增主題卡片
                </h3>
                <button onclick="closeCreateModal()" class="text-amber-400 hover:text-amber-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="create-card-form" onsubmit="handleCreateCard(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">主題 (Topic)</label>
                    <input type="text" id="card-topic" placeholder="例如：飲食日記、心得體會、旅遊..." required class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">標題 (Title)</label>
                    <input type="text" id="card-title" placeholder="請輸入標題" required class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">日期 (Date)</label>
                    <input type="date" id="card-date" required class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-800 mb-1">內容 (Content)</label>
                    <textarea id="card-content" rows="5" placeholder="寫下任何你想紀錄的文字..." required class="w-full bg-amber-50/50 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2 rounded-xl text-sm text-amber-700 bg-amber-100 hover:bg-amber-200 transition">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm text-white bg-amber-500 hover:bg-amber-600 shadow-md transition font-medium">發布卡片</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Card Full Detail & Comments -->
    <div id="modal-detail" class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl border border-amber-100 overflow-hidden max-h-[90vh] flex flex-col">
            <!-- Detail Header -->
            <div class="bg-amber-50 px-6 py-4 border-b border-amber-100 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <span id="detail-topic" class="text-xs px-2.5 py-1 rounded-md bg-amber-200 text-amber-800 font-medium">主題</span>
                    <span id="detail-date" class="text-xs text-amber-600"><i class="fa-regular fa-calendar mr-1"></i>2026-09-25</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="detail-delete-btn" title="刪除卡片" class="text-red-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                    <button onclick="closeDetailModal()" class="text-amber-400 hover:text-amber-700 p-1.5 rounded-lg hover:bg-amber-100 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Detail Body (Scrollable) -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                <div>
                    <h2 id="detail-title" class="text-2xl font-bold text-amber-900 mb-3">卡片標題</h2>
                    <p id="detail-content" class="text-amber-800 leading-relaxed whitespace-pre-wrap text-base border-b border-amber-100 pb-6">完整內容...</p>
                </div>

                <!-- Detail Comments Section -->
                <div class="space-y-4">
                    <h4 class="font-bold text-amber-900 text-sm flex items-center gap-2">
                        <i class="fa-regular fa-comments text-amber-500"></i> 留言討論 (<span id="detail-comment-count">0</span>)
                    </h4>
                    
                    <!-- Comment Input -->
                    <div class="flex gap-2">
                        <input type="text" id="detail-comment-input" placeholder="撰寫公開留言..." class="flex-1 bg-amber-50/60 border border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <button onclick="addCommentFromDetail()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">送出</button>
                    </div>

                    <!-- Comment List -->
                    <div id="detail-comments-list" class="space-y-2 pt-2">
                        <!-- Comments inserted dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initial Mock Data
        const initialCards = [
            {
                id: '1',
                topic: '晨間閱讀',
                title: '清晨的一杯咖啡與書香',
                date: '2026-09-25',
                content: '今天早晨特別靜謐，給自己沖了一杯衣索比亞的手沖咖啡。微酸的花果香氣在客廳瀰漫開來。\n\n翻開剛買的書，讀到一段話特別有感觸：「生活的藝術，在於學會欣賞那些看似微不足道的瞬間。」在忙碌的工作開始前，擁有這樣一個屬於自己的半小時，真的讓人感到心靈被充飽了電。希望今天也能順順利利！',
                comments: [
                    { id: 'c1', text: '這段話寫得真好！咖啡看起來也很誘人。', time: '09:15' },
                    { id: 'c2', text: '早起真的需要動力，向你學習～', time: '10:02' }
                ]
            },
            {
                id: '2',
                topic: '美味食記',
                title: '巷弄裡的溫暖日式定食',
                date: '2026-09-24',
                content: '下班後和朋友無意間發現了一家藏在小巷子裡的定食店。店門口掛著暖黃色的布簾，推開門就是濃濃的柴魚高湯香味。\n\n點了招牌的唐揚雞定食，外皮香酥多汁，配上軟糯的越光米飯和溫熱的味噌湯，一整天的疲憊瞬間都被治癒了。這絕對會成為我的口袋名單！',
                comments: [
                    { id: 'c3', text: '求店家地址！感覺超好吃！', time: '19:30' }
                ]
            },
            {
                id: '3',
                topic: '靈感隨筆',
                title: '關於秋天的小小心情',
                date: '2026-09-20',
                content: '微風漸漸有了涼意，街上的樹葉也開始微微泛黃。秋天總是不聲不響地來到身邊，帶走夏天的躁熱，帶來一份沉靜。這個季節最適合散步、思考，還有把那些閃過腦海的靈感記錄下來。',
                comments: []
            }
        ];

        let cards = [];
        let activeCardId = null;

        // Initialize LocalStorage
        function initData() {
            const stored = localStorage.getItem('warm_notes_cards');
            if (stored) {
                cards = JSON.parse(stored);
            } else {
                cards = initialCards;
                saveData();
            }
            
            // Set today's date as default for create form
            document.getElementById('card-date').value = new Date().toISOString().split('T')[0];
            
            renderCards();
        }

        function saveData() {
            localStorage.setItem('warm_notes_cards', JSON.stringify(cards));
        }

        // Render Cards Matrix
        function renderCards(filterDate = '') {
            const grid = document.getElementById('cards-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const filtered = filterDate 
                ? cards.filter(card => card.date === filterDate)
                : cards;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                filtered.forEach(card => {
                    grid.appendChild(createCardElement(card));
                });
            }
        }

        // Create Card HTML Element
        function createCardElement(card) {
            const cardEl = document.createElement('div');
            cardEl.className = 'bg-white rounded-2xl border border-amber-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col overflow-hidden relative group';
            
            cardEl.innerHTML = `
                <div class="p-5 flex-1 flex flex-col justify-between cursor-pointer" onclick="openDetailModal('${card.id}')">
                    <div>
                        <!-- Header / Topic & Date -->
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-amber-100 text-amber-800">${escapeHtml(card.topic)}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-amber-500 font-medium"><i class="fa-regular fa-calendar mr-1"></i>${card.date}</span>
                                <button onclick="event.stopPropagation(); deleteCard('${card.id}')" title="刪除" class="text-amber-300 hover:text-red-500 transition p-1">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Title -->
                        <h3 class="text-lg font-bold text-amber-900 mb-2 hover:text-amber-600 transition">${escapeHtml(card.title)}</h3>
                        
                        <!-- Content snippet -->
                        <p class="text-xs text-amber-800/80 leading-relaxed line-clamp-custom mb-3 whitespace-pre-wrap">${escapeHtml(card.content)}</p>
                    </div>
                    
                    <div class="text-xs text-amber-500 font-medium flex items-center justify-end gap-1 pt-2 border-t border-amber-50">
                        <span>閱讀全文與留言</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </div>
                </div>

                <!-- Card Footer / Direct Comment Row -->
                <div class="bg-amber-50/50 px-5 py-3 border-t border-amber-100/60 flex flex-col gap-2">
                    <div class="flex items-center justify-between text-xs text-amber-700">
                        <span class="font-medium"><i class="fa-regular fa-comment mr-1"></i>${card.comments.length} 條留言</span>
                    </div>

                    <!-- Compact Input -->
                    <div class="flex gap-2" onclick="event.stopPropagation()">
                        <input type="text" id="input-comment-${card.id}" placeholder="快速留言..." class="flex-1 bg-white border border-amber-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-amber-400">
                        <button onclick="addQuickComment('${card.id}')" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded-lg text-xs transition">送出</button>
                    </div>
                </div>
            `;
            return cardEl;
        }

        // Add Quick Comment from Card
        function addQuickComment(cardId) {
            const input = document.getElementById(`input-comment-${cardId}`);
            const text = input.value.trim();
            if (!text) return;

            const card = cards.find(c => c.id === cardId);
            if (card) {
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                card.comments.push({ id: Date.now().toString(), text: text, time: timeStr });
                saveData();
                renderCards(document.getElementById('filter-date').value);
            }
        }

        // Delete Card
        function deleteCard(cardId) {
            if (confirm('確定要刪除這張卡片嗎？此動作無法復原。')) {
                cards = cards.filter(c => c.id !== cardId);
                saveData();
                renderCards(document.getElementById('filter-date').value);
                closeDetailModal();
            }
        }

        // Open Detail Modal
        function openDetailModal(cardId) {
            const card = cards.find(c => c.id === cardId);
            if (!card) return;

            activeCardId = cardId;
            document.getElementById('detail-topic').innerText = card.topic;
            document.getElementById('detail-date').innerHTML = `<i class="fa-regular fa-calendar mr-1"></i>${card.date}`;
            document.getElementById('detail-title').innerText = card.title;
            document.getElementById('detail-content').innerText = card.content;
            
            // Delete Action in Modal
            document.getElementById('detail-delete-btn').onclick = () => deleteCard(cardId);

            renderDetailComments();

            const modal = document.getElementById('modal-detail');
            modal.classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('modal-detail').classList.add('hidden');
            activeCardId = null;
        }

        // Render Detail Modal Comments
        function renderDetailComments() {
            if (!activeCardId) return;
            const card = cards.find(c => c.id === activeCardId);
            if (!card) return;

            document.getElementById('detail-comment-count').innerText = card.comments.length;
            const list = document.getElementById('detail-comments-list');
            list.innerHTML = '';

            if (card.comments.length === 0) {
                list.innerHTML = `<p class="text-xs text-amber-500 italic py-2">目前沒有留言，來發表第一條留言吧！</p>`;
                return;
            }

            card.comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'bg-amber-50/70 p-3 rounded-xl border border-amber-100/80 text-xs text-amber-900 flex justify-between items-start gap-2';
                item.innerHTML = `
                    <div class="flex-1">
                        <p class="leading-relaxed text-amber-800">${escapeHtml(c.text)}</p>
                    </div>
                    <span class="text-[10px] text-amber-400 whitespace-nowrap">${c.time}</span>
                `;
                list.appendChild(item);
            });
        }

        // Add Comment from Detail Modal
        function addCommentFromDetail() {
            if (!activeCardId) return;
            const input = document.getElementById('detail-comment-input');
            const text = input.value.trim();
            if (!text) return;

            const card = cards.find(c => c.id === activeCardId);
            if (card) {
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                card.comments.push({ id: Date.now().toString(), text: text, time: timeStr });
                saveData();
                input.value = '';
                renderDetailComments();
                renderCards(document.getElementById('filter-date').value);
            }
        }

        // Create Modal Controls
        function openCreateModal() {
            document.getElementById('modal-create').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('modal-create').classList.add('hidden');
            document.getElementById('create-card-form').reset();
            document.getElementById('card-date').value = new Date().toISOString().split('T')[0];
        }

        function handleCreateCard(e) {
            e.preventDefault();
            const topic = document.getElementById('card-topic').value.trim();
            const title = document.getElementById('card-title').value.trim();
            const date = document.getElementById('card-date').value;
            const content = document.getElementById('card-content').value.trim();

            if (!topic || !title || !date || !content) return;

            const newCard = {
                id: Date.now().toString(),
                topic,
                title,
                date,
                content,
                comments: []
            };

            cards.unshift(newCard);
            saveData();
            closeCreateModal();
            
            // If filter is active, adjust to show new card
            const filterInput = document.getElementById('filter-date');
            if (filterInput.value && filterInput.value !== date) {
                resetFilter();
            } else {
                renderCards(filterInput.value);
            }
        }

        // Filter Logic
        document.getElementById('filter-date').addEventListener('change', (e) => {
            const val = e.target.value;
            const info = document.getElementById('filter-info');
            const clearBtn = document.getElementById('clear-filter');

            if (val) {
                info.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                document.getElementById('filter-date-display').innerText = val;
                renderCards(val);
            } else {
                resetFilter();
            }
        });

        function resetFilter() {
            document.getElementById('filter-date').value = '';
            document.getElementById('filter-info').classList.add('hidden');
            document.getElementById('clear-filter').classList.add('hidden');
            renderCards();
        }

        document.getElementById('clear-filter').addEventListener('click', resetFilter);

        // Utility Function to Prevent XSS
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Run on Page Load
        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
